# 本插件作为 bundle 的插入清单。
#
# 装法是 `dsh plugin --profile web add github:Shiyuedong-Jade/DM-recovery`
# （或 `file:<本目录绝对路径>`）：CLI 看到 package.json 里有 dsh.bundle.patch，
# 会把包名自动追加进 dsh.profile.bundles，**并自动带上这一行**，不需要手改 profile。
#
# ⚠️ `file:` 安装的绝对路径**不能含空格**：`dsh plugin` 会转发给 pnpm，参数在空格处断开。
#    包放在带空格的开发目录里时，先复制到无空格的路径再装
#    （例如 D:\dsh-plugins\dsh-plugin-dm-recovery-readiness）。
#
# 不想走 bundle 路线（例如只想临时试一下）时，也可以手工在
# ~/.dsh/profiles/web/cordis.patch.yml 里加同样的一行；profile 是 patchReload: live 的，
# 保存即生效、不用重启 dsh web。
#
# 想覆盖配置就在行里加 config。可用的项与默认值见 README「配置」一节，
# 下面注释掉的几项是最常改的：
#   - insert:
#       - id: dm-recovery-readiness
#         name: 'dsh-plugin-dm-recovery-readiness'
#         config:
#           host: '10.0.0.61'                        # 换成你的数据库地址
#           port: 7236                               # DMDSC 常见 7236 / 7237，单实例 5236
#           user: 'SYSDBA'
#           credentialRef: 'DM_RECOVERY_PASSWORD'    # 口令来源之一；卡片手输是本项目约定
#           home: 'D:\dm-recovery-home'              # 默认 ~/.dsh/dm-recovery-readiness
- insert:
    - id: dm-recovery-readiness
      name: 'dsh-plugin-dm-recovery-readiness'
